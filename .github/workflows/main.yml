name: Build & Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Environment & Keystore
        run: |
          # 1. Ensure .env exists so secrets plugin does not fail
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # 2. Accept Android SDK licenses
          yes | sdkmanager --licenses || true

          # 3. Restore or create debug.keystore
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: |
          # 1. Detect project directory
          PROJECT_DIR="."
          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            FOUND=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
            if [ -n "$FOUND" ]; then
              PROJECT_DIR=$(dirname "$FOUND")
            fi
          fi
          echo "Project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # 2. Ensure secrets and keystore exist
          [ ! -f ".env" ] && ([ -f ".env.example" ] && cp .env.example .env || touch .env)
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 3. Ensure gradlew wrapper exists
          if [ ! -f "./gradlew" ]; then
            echo "Generating gradlew wrapper..."
            gradle wrapper || true
          fi

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleDebug -Dorg.gradle.configuration-cache=false -Dorg.gradle.daemon=false --stacktrace
          else
            gradle :app:assembleDebug -Dorg.gradle.configuration-cache=false -Dorg.gradle.daemon=false --stacktrace
          fi

      - name: Prepare Release Asset
        id: prepare_asset
        if: success()
        run: |
          mkdir -p release-assets
          APK_FILE=$(find . -type f -name "*-debug.apk" -o -name "app-debug.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK file not found!"
            exit 1
          fi
          echo "Found APK: $APK_FILE"
          VERSION_TAG="${GITHUB_REF_NAME:-v1.0.${GITHUB_RUN_NUMBER}}"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            VERSION_TAG="v1.0.${GITHUB_RUN_NUMBER}"
          fi
          ASSET_NAME="XML-Video-Editor-${VERSION_TAG}-debug.apk"
          cp "$APK_FILE" "release-assets/${ASSET_NAME}"
          echo "tag_name=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          echo "asset_path=release-assets/${ASSET_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug-apk
          path: release-assets/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: success() && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch')
        with:
          tag_name: ${{ steps.prepare_asset.outputs.tag_name }}
          name: Release ${{ steps.prepare_asset.outputs.tag_name }}
          files: ${{ steps.prepare_asset.outputs.asset_path }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}          ASSET_NAME="XML-Video-Editor-${VERSION_TAG}-debug.apk"
          cp "$APK_FILE" "release-assets/${ASSET_NAME}"
          echo "tag_name=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          echo "asset_path=release-assets/${ASSET_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug-apk
          path: release-assets/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: success() && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch')
        with:
          tag_name: ${{ steps.prepare_asset.outputs.tag_name }}
          name: Release ${{ steps.prepare_asset.outputs.tag_name }}
          files: ${{ steps.prepare_asset.outputs.asset_path }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
